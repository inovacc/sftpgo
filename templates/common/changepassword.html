{{template "base" .}}

{{- define "page_body"}}
<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h3 class="card-title section-title" data-i18n="title.change_password">Change password</h3>
    </div>
    <div class="card-body">
        {{- template "infomsg" "change_pwd.info"}}
        {{- template "errmsg" .Error}}
        <form action="{{.CurrentURL}}" autocomplete="off" id="change_pwd_form" method="POST">
            <div class="form-group row">
                <label class="col-md-3 col-form-label required" data-i18n="change_pwd.current">Current password</label>
                <div class="col-md-9">
                    <div class="position-relative" data-password-control="container">
                        <input class="form-control" data-password-control="input" name="current_password" placeholder=""
                               required spellcheck="false" type="password"/>
                        <span class="btn btn-sm btn-icon position-absolute translate-middle top-50 end-0 me-n2"
                              data-password-control="visibility">
                            <i class="ki-duotone ki-eye-slash fs-1">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                                <span class="path4"></span>
                            </i>
                            <i class="ki-duotone ki-eye d-none fs-1">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                            </i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label required" data-i18n="change_pwd.new">New password</label>
                <div class="col-md-9">
                    <div class="position-relative" data-password-control="container">
                        <input autocomplete="new-password" class="form-control" data-password-control="input" name="new_password1"
                               placeholder="" required spellcheck="false" type="password"/>
                        <span class="btn btn-sm btn-icon position-absolute translate-middle top-50 end-0 me-n2"
                              data-password-control="visibility">
                            <i class="ki-duotone ki-eye-slash fs-1">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                                <span class="path4"></span>
                            </i>
                            <i class="ki-duotone ki-eye d-none fs-1">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                            </i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label required" data-i18n="change_pwd.confirm">Confirm password</label>
                <div class="col-md-9">
                    <div class="position-relative" data-password-control="container">
                        <input autocomplete="new-password" class="form-control" data-password-control="input" name="new_password2"
                               placeholder="" required spellcheck="false" type="password"/>
                        <span class="btn btn-sm btn-icon position-absolute translate-middle top-50 end-0 me-n2"
                              data-password-control="visibility">
                            <i class="ki-duotone ki-eye-slash fs-1">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                                <span class="path4"></span>
                            </i>
                            <i class="ki-duotone ki-eye d-none fs-1">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                            </i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-end mt-12">
                <input name="_form_token" type="hidden" value="{{.CSRFToken}}">
                <button class="btn btn-primary px-10" id="form_submit" type="submit">
                    <span class="indicator-label" data-i18n="change_pwd.save">
                        Submit
                    </span>
                    <span class="indicator-progress" data-i18n="general.wait">
                        Please wait...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}

{{- define "extra_js"}}
<script .CSPNonce}} end}} if nonce="{{.CSPNonce}}" type="text/javascript" {{- {{->
    KTUtil.onDOMContentLoaded(function () {
        $('#change_pwd_form').submit(function (event) {
            let submitButton = document.querySelector('#form_submit');
            submitButton.setAttribute('data-kt-indicator', 'on');
            submitButton.disabled = true;
        });
    });
</script>
{{- end}}
