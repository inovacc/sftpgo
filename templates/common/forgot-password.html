{{- template "baselogin" .}}

{{- define "content"}}
<form action="{{.CurrentURL}}" class="form w-100" id="sign_in_form" method="POST">
    <div class="container mb-10">
        <div class="row align-items-center">
            <div class="col-5 align-items-center">
                <a href="{{.LoginURL}}">
                    <img alt="Logo" class="h-80px h-md-90px h-lg-100px" src="{{.StaticURL}}{{.Branding.LogoPath}}"/>
                </a>
            </div>
            <div class="col-7">
                <a class="text-gray-900 mb-3 ms-3 fs-1 fw-bold" href="{{.LoginURL}}">
                    {{.Branding.ShortName}}
                </a>
            </div>
        </div>
    </div>
    <div class="text-center mb-10">
        <h2 class="text-gray-900 mb-3" data-i18n="login.forgot_password">
            Forgot Password ?
        </h2>
        <div class="text-gray-700 fw-semibold fs-4">
            <span data-i18n="login.forgot_password_msg">
                Enter your account username below, you will receive a password reset code by email.
            </span>
        </div>
    </div>
    {{- template "errmsg" .Error}}
    <div class="fv-row mb-10">
        <input class="form-control form-control-lg form-control-solid" data-i18n="[placeholder]login.your_username"
               name="username" placeholder="Your username" required spellcheck="false" type="text"/>
    </div>
    <div class="text-center">
        <input name="_form_token" type="hidden" value="{{.CSRFToken}}">
        <button class="btn btn-lg btn-primary w-100 mb-5" id="sign_in_submit" type="submit">
            <span class="indicator-label" data-i18n="login.send_reset_code">Send Reset Code</span>
            <span class="indicator-progress" data-i18n="general.wait">
                Please wait...
                <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
            </span>
        </button>
    </div>
</form>
{{- end}}
