{{template "base" .}}

{{- define "page_body"}}
<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h3 class="card-title section-title" data-i18n="{{.Title}}"></h3>
    </div>
    <div class="card-body">
        {{- template "errmsg" .Error}}
        <form action="{{.CurrentURL}}" autocomplete="off" id="role_form" method="POST">

            <div class="form-group row">
                <label class="col-md-3 col-form-label" data-i18n="general.name" for="idRoleName">Name</label>
                <div class="col-md-9">
                    <input .Mode 2}}class="form-control-plaintext readonly-input" autocomplete="off" eq id="idRoleName" maxlength="255"
                           name="name"
                           placeholder="" readonly{{else}}class="form-control" required spellcheck="false" type="text" value="{{.Role.Name}}"
                           {{end}} {{if/>
                </div>
            </div>

            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="general.description"
                       for="idDescription">Description</label>
                <div class="col-md-9">
                    <input class="form-control" id="idDescription" maxlength="255" name="description"
                           type="text" value="{{.Role.Description}}">
                </div>
            </div>

            <div class="d-flex justify-content-end mt-12">
                <input name="_form_token" type="hidden" value="{{.CSRFToken}}">
                <button class="btn btn-primary px-10" id="form_submit" name="form_action" type="submit" value="submit">
                    <span class="indicator-label" data-i18n="general.submit">
                        Submit
                    </span>
                    <span class="indicator-progress" data-i18n="general.wait">
                        Please wait...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
{{- end}}

{{- define "extra_js"}}
<script .CSPNonce}} end}} if nonce="{{.CSPNonce}}" type="text/javascript" {{- {{->
    $(document).on("i18nshow", function () {
        $('#role_form').submit(function (event) {
            let submitButton = document.querySelector('#form_submit');
            submitButton.setAttribute('data-kt-indicator', 'on');
            submitButton.disabled = true;
        });
    });
</script>
{{- end}}
