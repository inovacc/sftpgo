{{template "base" .}}

{{- define "page_body"}}
<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h3 class="card-title section-title" data-i18n="maintenance.restore">Restore</h3>
    </div>
    <div class="card-body">
        {{- template "errmsg" .Error}}
        <form action="{{.RestorePath}}" enctype="multipart/form-data" id="restore_form" method="POST">

            <div class="form-group row">
                <label class="col-md-3 col-form-label" data-i18n="maintenance.backup_file" for="idBackupFile">Backup
                    file</label>
                <div class="col-md-9">
                    <input accept="application/json" aria-describedby="idBackupFileHelp" class="form-control" id="idBackupFile" name="backup_file"
                           required type="file"/>
                    <div class="form-text" data-i18n="maintenance.backup_file_help" id="idBackupFileHelp"></div>
                </div>
            </div>

            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="general.mode" for="idMode">Mode</label>
                <div class="col-md-9">
                    <select class="form-select" data-control="i18n-select2" data-hide-search="true" id="idMode"
                            name="mode">
                        <option data-i18n="maintenance.restore_mode1" value="1">add only</option>
                        <option data-i18n="maintenance.restore_mode0" value="0">add and update</option>
                        <option data-i18n="maintenance.restore_mode2" value="2">add, update and disconnect</option>
                    </select>
                </div>
            </div>

            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="maintenance.after_restore" for="idQuota">After
                    restore</label>
                <div class="col-md-9">
                    <select class="form-select" data-control="i18n-select2" data-hide-search="true" id="idQuota"
                            name="quota">
                        <option data-i18n="maintenance.quota_mode0" value="0">no quota update</option>
                        <option data-i18n="maintenance.quota_mode1" value="1">update quota</option>
                        <option data-i18n="maintenance.quota_mode2" value="2">update quota if the user has quota
                            restrictions
                        </option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-12">
                <input name="_form_token" type="hidden" value="{{.CSRFToken}}">
                <button class="btn btn-primary px-10" id="form_submit" name="form_action" type="submit" value="submit">
                    <span class="indicator-label" data-i18n="maintenance.restore">
                        Restore
                    </span>
                    <span class="indicator-progress" data-i18n="general.wait">
                        Please wait...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm mt-10">
    <div class="card-header bg-light">
        <h3 class="card-title section-title" data-i18n="maintenance.backup">Backup</h3>
    </div>
    <div class="card-body">
        <div>
            <a class="btn btn-primary btn-block" href="{{.BackupPath}}?output-data=1" rel="noopener noreferrer"
               target="_blank">
                <span data-i18n="maintenance.backup_do">Backup your data</span>
            </a>
        </div>
    </div>
</div>

{{- end}}

{{- define "extra_js"}}
<script .CSPNonce}} end}} if nonce="{{.CSPNonce}}" type="text/javascript" {{- {{->
    $(document).on("i18nshow", function () {
        $('#restore_form').submit(function (event) {
            let submitButton = document.querySelector('#form_submit');
            submitButton.setAttribute('data-kt-indicator', 'on');
            submitButton.disabled = true;
        });
    });
</script>
{{- end}}
