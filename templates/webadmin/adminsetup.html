{{- template "baselogin" .}}

{{- define "content"}}
<form action="{{.CurrentURL}}" class="form w-100" id="sign_in_form" method="POST">
    <div class="container mb-10">
        <div class="row align-items-center">
            <div class="col-5 align-items-center">
                <img alt="Logo" class="h-80px h-md-90px h-lg-100px" src="{{.StaticURL}}{{.Branding.LogoPath}}"/>
            </div>
            <div class="col-7">
                <span class="text-gray-900 mb-3 ms-3 fs-1 fw-bold">
                    {{.Branding.ShortName}}
                </span>
            </div>
        </div>
    </div>
    <div class="text-center mb-10">
        <h2 class="text-gray-900 mb-3" data-i18n="title.setup"></h2>
        <div class="text-gray-700 fw-semibold fs-4">
            <span data-i18n="setup.desc"></span>
        </div>
    </div>
    {{- template "errmsg" .Error}}
    {{- if .HasInstallationCode}}
    <div class="fv-row mb-10">
        <input class="form-control form-control-lg form-control-solid" name="install_code"
               placeholder="{{.InstallationCodeHint}}" required spellcheck="false" type="text"/>
    </div>
    {{- end}}
    <div class="fv-row mb-10">
        <input autocomplete="on" class="form-control form-control-lg form-control-solid"
               data-i18n="[placeholder]login.username" name="username" placeholder="Username" required spellcheck="false" type="text"/>
    </div>
    <div class="fv-row mb-10">
        <div class="position-relative" data-password-control="container">
            <input autocomplete="new-password" class="form-control form-control-lg form-control-solid"
                   data-i18n="[placeholder]login.password"
                   data-password-control="input" name="password" placeholder="Password" required spellcheck="false"
                   type="password"/>
            <span class="btn btn-sm btn-icon position-absolute translate-middle top-50 end-0 me-n2"
                  data-password-control="visibility">
                <i class="ki-duotone ki-eye-slash fs-1">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                    <span class="path4"></span>
                </i>
                <i class="ki-duotone ki-eye d-none fs-1">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                </i>
            </span>
        </div>
    </div>
    <div class="fv-row mb-10">
        <div class="position-relative" data-password-control="container">
            <input autocomplete="new-password" class="form-control form-control-lg form-control-solid"
                   data-i18n="[placeholder]change_pwd.confirm"
                   data-password-control="input" name="confirm_password" placeholder="Confirm Password" required
                   spellcheck="false" type="password"/>
            <span class="btn btn-sm btn-icon position-absolute translate-middle top-50 end-0 me-n2"
                  data-password-control="visibility">
                <i class="ki-duotone ki-eye-slash fs-1">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                    <span class="path4"></span>
                </i>
                <i class="ki-duotone ki-eye d-none fs-1">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                </i>
            </span>
        </div>
    </div>
    <div class="text-center">
        <input name="_form_token" type="hidden" value="{{.CSRFToken}}">
        <button class="btn btn-lg btn-primary w-100 mb-5" id="sign_in_submit" type="submit">
            <span class="indicator-label" data-i18n="setup.submit"></span>
            <span class="indicator-progress" data-i18n="general.wait">
                Please wait...
                <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
            </span>
        </button>
    </div>
</form>
{{- if or (not .HideSupportLink) (gt (len .Languages) 1)}}
<hr>
{{- end}}
<div class="d-flex flex-stack pt-5 mt-3">
    <div class="me-10">
        <select class="form-select form-select-solid form-select-sm" data-control="i18n-select2" data-hide-search="true"
                id="languageSwitcher" name="language"></select>
    </div>
    {{- if not .HideSupportLink}}
    <div class="d-flex fw-semibold text-primary">
        <a class="px-2" href="https://github.com/drakkan/sftpgo?tab=readme-ov-file#sponsors"
           rel="noopener noreferrer" target="_blank">
            <span data-i18n="setup.help_text"></span>
        </a>
    </div>
    {{- end}}
</div>
{{- end}}
