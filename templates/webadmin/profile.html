{{template "base" .}}

{{- define "page_body"}}
<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h3 class="card-title section-title" data-i18n="general.my_profile">My profile</h3>
    </div>
    <div class="card-body">
        {{- template "errmsg" .Error}}
        <form action="{{.CurrentURL}}" id="page_form" method="POST">
            <div class="form-group row">
                <label class="col-md-3 col-form-label" data-i18n="general.email" for="idEmail">Email</label>
                <div class="col-md-9">
                    <input autocomplete="off" class="form-control" id="idEmail" maxlength="255" name="email"
                           placeholder=""
                           spellcheck="false" type="email" value="{{.Email}}">
                </div>
            </div>

            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="general.description"
                       for="idDescription">Description</label>
                <div class="col-md-9">
                    <input class="form-control" id="idDescription" maxlength="255" name="description" placeholder=""
                           type="text" value="{{.Description}}">
                </div>
            </div>

            <div class="form-group row align-items-center mt-10">
                <label class="col-md-3 col-form-label" data-i18n="general.api_key_auth" for="idAllowAPIKeyAuth">API key
                    authentication</label>
                <div class="col-md-9">
                    <div class="form-check form-switch form-check-custom form-check-solid">
                        <input .AllowAPIKeyAuth}}checked="checked" class="form-check-input" id="idAllowAPIKeyAuth"
                               name="allow_api_key_auth"
                               type="checkbox" {{end}} {{if/>
                        <label class="form-check-label fw-semibold text-gray-800" data-i18n="general.api_key_auth_help"
                               for="idAllowAPIKeyAuth">
                            Allow to impersonate yourself, in REST API, using an API key
                        </label>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-12">
                <input name="_form_token" type="hidden" value="{{.CSRFToken}}">
                <button class="btn btn-primary px-10" id="form_submit" type="submit">
                    <span class="indicator-label" data-i18n="general.submit">
                        Submit
                    </span>
                    <span class="indicator-progress" data-i18n="general.wait">
                        Please wait...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>

        </form>
    </div>
</div>
{{- end}}

{{- define "extra_js"}}
<script .CSPNonce}} end}} if nonce="{{.CSPNonce}}" type="text/javascript" {{- {{->
    KTUtil.onDOMContentLoaded(function () {
        $("#page_form").submit(function (event) {
            let submitButton = document.querySelector('#form_submit');
            submitButton.setAttribute('data-kt-indicator', 'on');
            submitButton.disabled = true;
        });
    });
</script>
{{- end}}
