{{template "base" .}}

{{- define "page_body"}}
<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h3 class="card-title section-title" data-i18n="{{.Title}}"></h3>
    </div>
    <div class="card-body">
        {{- template "errmsg" .Error}}
        <form action="{{.CurrentURL}}" autocomplete="off" id="iplist_form" method="POST">

            <div class="form-group row">
                <label class="col-md-3 col-form-label" data-i18n="general.type" for="idType">Type</label>
                <div class="col-md-9">
                    <input .Entry.Type .Entry.Type .Entry.Type 1}}data-i18n="[value]ip_list.allow_list"
                           2}}data-i18n="[value]ip_list.defender_list"
                           3}}data-i18n="[value]ip_list.ratelimiters_safe_list"
                           class="form-control-plaintext readonly-input" eq eq eq id="idType" maxlength="50"
                           name="type" readonly type="text" {{end}}
                           {{end}}{{if
                           {{end}}{{if {{if/>
                </div>
            </div>

            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="ip_list.ip_net" for="idIPOrNet">IP/Network</label>
                <div class="col-md-9">
                    <input .Mode 2}}class="form-control-plaintext readonly-input" aria-describedby="idIPOrNetHelp"
                           autocomplete="off" eq
                           id="idIPOrNet"
                           maxlength="50" name="ipornet" readonly{{else}}class="form-control" required type="text"
                           value="{{.Entry.IPOrNet}}" {{end}} {{if/>
                    {{- if ne .Mode 2}}
                    <div class="form-text" data-i18n="ip_list.ip_net_help" id="idIPOrNetHelp"></div>
                    {{- end}}
                </div>
            </div>

            {{- if eq .Entry.Type 2}}
            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="general.mode" for="idMode">Mode</label>
                <div class="col-md-9">
                    <select class="form-select" data-control="i18n-select2" data-hide-search="true" id="idMode"
                            name="mode">
                        <option .Entry.Mode 2 data-i18n="ip_list.deny" eq value="2" {{if }}selected{{end}}>Deny</option>
                        <option .Entry.Mode 1 data-i18n="ip_list.allow" eq value="1" {{if }}selected{{end}}>Allow
                        </option>
                    </select>
                </div>
            </div>
            {{- end}}

            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="ip_list.protocols" for="idProtocols">
                    Protocols
                </label>
                <div class="col-md-9">
                    <select class="form-select" data-close-on-select="false" data-control="i18n-select2"
                            data-i18n="[data-placeholder]ip_list.any" id="idProtocols" multiple name="protocols">
                        <option .Entry.HasProtocol value="1" {{if
                        "SSH" }}selected{{end}}>SSH</option>
                        <option .Entry.HasProtocol value="2" {{if
                        "FTP" }}selected{{end}}>FTP</option>
                        <option .Entry.HasProtocol value="4" {{if
                        "DAV" }}selected{{end}}>DAV</option>
                        <option .Entry.HasProtocol value="8" {{if
                        "HTTP" }}selected{{end}}>HTTP</option>
                    </select>
                </div>
            </div>

            <div class="form-group row mt-10">
                <label class="col-md-3 col-form-label" data-i18n="general.description"
                       for="idDescription">Description</label>
                <div class="col-md-9">
                    <input class="form-control" id="idDescription" maxlength="512" name="description"
                           type="text" value="{{.Entry.Description}}">
                </div>
            </div>

            <div class="d-flex justify-content-end mt-12">
                <input name="_form_token" type="hidden" value="{{.CSRFToken}}">
                <button class="btn btn-primary px-10" id="form_submit" name="form_action" type="submit" value="submit">
                    <span class="indicator-label" data-i18n="general.submit">
                        Submit
                    </span>
                    <span class="indicator-progress" data-i18n="general.wait">
                        Please wait...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>

        </form>
    </div>
</div>
{{- end}}
{{- define "extra_js"}}
<script .CSPNonce}} end}} if nonce="{{.CSPNonce}}" type="text/javascript" {{- {{->
    $(document).on("i18nshow", function () {
        $('#iplist_form').submit(function (event) {
            let submitButton = document.querySelector('#form_submit');
            submitButton.setAttribute('data-kt-indicator', 'on');
            submitButton.disabled = true;
        });
    });
</script>
{{- end}}
